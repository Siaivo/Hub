<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Клієнти PluginHub — куди вставляти посилання на плагіни під кожну платформу">
<meta name="color-scheme" content="light dark">
<title>Клієнти — PluginHub</title>
<link rel="stylesheet" href="./assets/style.css">
<style>
/* Токени успадковуються з assets/style.css (Lampa: #1d1f20 / #262829 / SegoeUI) */
.clients-nav{padding:1em 0 .6em;display:flex;flex-wrap:wrap;gap:.6em}
.clients-nav .chip{text-decoration:none;display:inline-flex;align-items:center;gap:.4em}
.clients-nav .chip svg{width:.9em;height:.9em;flex-shrink:0;opacity:.9}
.clients-intro{max-width:62em}
#clients-grid{display:grid;gap:1.2em;grid-template-columns:1fr}
@media(min-width:860px){#clients-grid{grid-template-columns:repeat(2,1fr)}}
.client-card{scroll-margin-top:76px}
.client-card.is-highlight{border-color:rgba(255,255,255,.18);box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.client-head{display:flex;align-items:center;gap:.8em;flex-wrap:wrap}
.client-icon{width:2.5em;height:2.5em;display:grid;place-items:center;flex-shrink:0;border-radius:.7em;background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);line-height:1}
.client-icon svg{width:1.25em;height:1.25em}
.client-head h3{font-size:1.15em;font-weight:400;flex:1 1 auto;color:var(--text);line-height:1.25}
.badge-recommended{background:var(--success-soft);color:var(--success);border-color:rgba(101,234,167,.22)}
.badge-sideload{background:rgba(229,71,71,.12);color:var(--danger);border-color:rgba(229,71,71,.22)}
.client-audience{font-size:.88em;color:var(--muted);margin-top:.15em}
.client-audience span{color:var(--text);font-weight:600}
.client-steps{margin:.5em 0 0 1.15em;font-size:.95em;line-height:1.45}
.client-steps li{margin:.15em 0}
.os-req{font-size:.78em;color:var(--muted);margin-top:.4em}
.client-links{display:flex;gap:.6em;flex-wrap:wrap;margin-top:.7em}

</style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div class="header-title">
      <h1><a href="./index.html" style="color:inherit;text-decoration:none">Каталог плагінів</a> <span style="font-weight:400;color:var(--muted);font-family:var(--font-body);font-size:.72em;letter-spacing:-.01em">/ Клієнти</span></h1>
      <span class="counter" id="platform-counter"></span>
    </div>
    <nav class="header-nav" aria-label="Навігація">
      <a class="btn btn-ghost" href="./index.html">Каталог</a>
      <a class="btn btn-ghost" href="./clients.html" aria-current="page">Клієнти</a>
      <a class="btn btn-ghost" href="./portals.html">Портали</a>
      <a class="btn btn-ghost header-cta" href="https://github.com/Siaivo/PluginHub/issues/new?template=plugin.yml" target="_blank" rel="noopener">Запропонувати плагін</a>
    </nav>
  </div>
</header>

<main class="container">
  <nav class="chips clients-nav" aria-label="Фільтр платформ" id="clients-filters">
    <button class="chip is-active" data-filter="all">Усі</button>
    <button class="chip" data-filter="android"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="7" width="14" height="11" rx="2"/><path d="M9 7V5"/><path d="M15 7V5"/><circle cx="9.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="14.5" cy="12" r="1" fill="currentColor" stroke="none"/></svg> Android</button>
    <button class="chip" data-filter="smart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 21h6"/><path d="M12 18v3"/></svg> Smart TV</button>
  </nav>

  <div id="clients-grid" class="grid" aria-live="polite" aria-busy="true"></div>

  <div id="clients-error" class="state state-error" hidden>
    <p class="state-title">Не вдалося завантажити clients.json</p>
    <p class="state-desc">Перевірте зʼєднання або оновіть сторінку. Файл: <code>data/clients.json</code></p>
    <button type="button" id="retry-clients" class="btn btn-primary">Спробувати ще</button>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span>Джерело даних: <a href="./data/clients.json" target="_blank" rel="noopener">data/clients.json</a></span>
    <span class="dot" aria-hidden="true">·</span> <a href="./index.html">Каталог</a>
    <span class="dot" aria-hidden="true">·</span> <a href="./portals.html">Портали</a>
    <span class="dot" aria-hidden="true">·</span> <a href="https://github.com/Siaivo/Hub" target="_blank" rel="noopener">GitHub</a>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="./assets/clients.js"></script>
</body>
</html>
