name: Vote tally

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: vote-tally
  cancel-in-progress: false

jobs:
  tally:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run vote tally
        run: node scripts/vote-tally.mjs
        env:
          THRESHOLD_APPROVE: ${{ vars.THRESHOLD_APPROVE || '10' }}
          LIMIT_REJECT: ${{ vars.LIMIT_REJECT || '5' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
