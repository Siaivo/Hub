name: Check Dead URLs

on:
  schedule:
    # Кожні 14 днів: 1-го та 15-го числа о 03:00 UTC
    - cron: "0 3 1,15 * *"
  workflow_dispatch: # Ручний запуск

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-dead
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run URL check
        id: check
        run: |
          node scripts/check-urls.mjs
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true
        # exit code 1 = є зміни, 0 = немає, 2 = помилка

      - name: Check for changes
        id: changes
        if: steps.check.outputs.exit_code == '1'
        run: |
          if [ -f .check-dead-changes.json ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "📦 Зміни:"
            cat .check-dead-changes.json
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dead URL statuses"
          branch: auto/check-dead
          delete-branch: true
          title: "🔗 Auto: dead URL check — $(date +'%Y-%m-%d')"
          body: |
            ## Звіт перевірки URL

            Автоматично виявлено зміни стану плагінів.

            Цей PR створено та змержено автоматично воркфлоу `check-dead.yml`.
          labels: |
            automated
            dead-urls

      - name: Auto-merge PR
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.pr.outputs.pull-request-number }}"
          echo "🔀 Мержу PR #$PR..."
          gh pr merge "$PR" --squash --auto

      - name: Cleanup
        if: always()
        run: rm -f .check-dead-changes.json
