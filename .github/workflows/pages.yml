name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'clients.html'
      - 'portals.html'
      - 'assets/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data
        run: node scripts/validate.mjs
      - name: Validate JSON
        run: |
          python3 -m json.tool data/base.json > /dev/null
          python3 -m json.tool data/clients.json > /dev/null
          python3 -m json.tool data/portals.json > /dev/null
          python3 -m json.tool data/schema.json > /dev/null
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
