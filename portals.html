<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Портали PluginHub — чистий портал, дзеркала та портали спільноти">
<meta name="color-scheme" content="light dark">
<title>Портали — PluginHub</title>
<link rel="stylesheet" href="./assets/style.css">
<style>
#portals-grid{display:grid;gap:1.2em;grid-template-columns:1fr}
@media(min-width:860px){#portals-grid{grid-template-columns:repeat(2,1fr)}}
.portal-card{scroll-margin-top:76px}
.portal-card.is-highlight{border-color:rgba(255,255,255,.18);box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.portal-head{display:flex;align-items:center;justify-content:space-between;gap:.7em;flex-wrap:wrap}
.portal-head h3{font-size:1.15em;font-weight:400;color:var(--text);line-height:1.25}
.badge-community{background:rgba(93,191,245,.12);color:var(--accent-2);border-color:rgba(93,191,245,.22)}
.portal-url-row{display:flex;gap:.5em;align-items:center;flex-wrap:wrap;margin-top:.15em}
.portal-url{font-family:var(--font-mono);font-size:.82em;word-break:break-all;color:var(--muted)}
.btn-copy{white-space:nowrap}
.btn-copy.is-copied{background:var(--success);color:#000;border-color:transparent}
.portal-mirrors-label{font-family:var(--font-mono);font-size:.72em;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:.7em}
.mirrors-row{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.4em}
.mirror-chip{font-family:var(--font-mono);font-size:.78em;padding:.3em .6em;border-radius:var(--radius-pill);background:rgba(255,255,255,.06);border:1px solid var(--border);word-break:break-all;color:var(--muted)}
.mirror-details{margin-top:.4em}
.mirror-details summary{cursor:pointer;font-size:.88em;font-weight:600;color:var(--accent-2);list-style:none}
.mirror-details summary::-webkit-details-marker{display:none}
.mirror-details summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
.mirror-details[open] summary::before{transform:rotate(90deg)}
.portal-desc{font-size:.95em;line-height:1.45;margin-top:.55em;color:var(--muted)}
.portal-note{font-size:.78em;color:var(--muted);margin-top:.25em}
.portal-foot{display:flex;gap:.5em;align-items:center;flex-wrap:wrap;margin-top:.8em;font-size:.85em}
</style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div class="header-title">
      <h1><a href="./index.html" style="color:inherit;text-decoration:none">Каталог плагінів</a> <span style="font-weight:400;color:var(--muted);font-family:var(--font-body);font-size:.72em;letter-spacing:-.01em">/ Портали</span></h1>
      <span class="counter">Портали спільноти</span>
    </div>
    <nav class="header-nav" aria-label="Навігація">
      <a class="btn btn-ghost" href="./index.html">Каталог</a>
      <a class="btn btn-ghost" href="./clients.html">Клієнти</a>
      <a class="btn btn-ghost" href="./portals.html" aria-current="page">Портали</a>
      <a class="btn btn-ghost header-cta" href="https://github.com/Siaivo/PluginHub/issues/new?template=plugin.yml" target="_blank" rel="noopener">Запропонувати плагін</a>
    </nav>
  </div>
</header>

<main class="container">
  <p class="clients-intro" style="color:var(--muted);font-size:14px;margin:14px 0 10px;line-height:1.65;max-width:680px"></p>

  <div id="portals-grid" class="grid" aria-live="polite" aria-busy="true"></div>

  <div id="portals-error" class="state state-error" hidden>
    <p class="state-title">Не вдалося завантажити portals.json</p>
    <p class="state-desc">Перевірте зʼєднання або оновіть сторінку. Файл: <code>data/portals.json</code></p>
    <button type="button" id="retry-portals" class="btn btn-primary">Спробувати ще</button>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span>Джерело даних: <a href="./data/portals.json" target="_blank" rel="noopener">data/portals.json</a></span>
    <span class="dot" aria-hidden="true">·</span> <a href="./index.html">Каталог</a>
    <span class="dot" aria-hidden="true">·</span> <a href="./clients.html">Клієнти</a>
    <span class="dot" aria-hidden="true">·</span> <a href="https://github.com/Siaivo/Hub" target="_blank" rel="noopener">GitHub</a>
  </div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="./assets/portals.js"></script>
</body>
</html>
